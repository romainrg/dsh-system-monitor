<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="System monitor">
  <defs>
    <!-- userSpaceOnUse: a horizontal or vertical stroke has a zero-height or
         zero-width bounding box, so an objectBoundingBox gradient would not
         paint the stand at all. -->
    <linearGradient id="frame" gradientUnits="userSpaceOnUse" x1="4" y1="8" x2="60" y2="56">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="pulse" gradientUnits="userSpaceOnUse" x1="14" y1="31" x2="48" y2="31">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect x="5" y="8" width="54" height="38" rx="9" fill="none" stroke="url(#frame)" stroke-width="5"/>
  <path d="M14 30.5h8.5l4.5-9 6 17 4.5-8h8.5" fill="none" stroke="url(#pulse)" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M22 51.5h20" fill="none" stroke="url(#frame)" stroke-width="5" stroke-linecap="round"/>
  <path d="M32 45.5v6" fill="none" stroke="url(#frame)" stroke-width="5" stroke-linecap="round"/>
</svg>
